<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Classroom tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<!--
  HOW TO ADD A TOOL
  1. Put the tool in its own folder next to this file, e.g. /picker/index.html (one self-contained HTML file).
  2. Add one line to the TOOLS list in the script at the bottom: name, short description, folder link.
  That is all. Nothing else on this page needs to change.

  STYLE (reuse in every tool so they match)
  surface #fafbf6 · tint #edf4e3 · hairline #cbd5c0 · ink #1e2b1e · muted #4f5e4f · leaf #4e9a2a
  font: 'Noto Sans JP', Arial, sans-serif · light background, leaf-green accent, no small caps
  title block: 80px x 8px leaf rule above a bold h1 · cards: tint background, 1px hairline, 8px radius
-->
<style>
  :root {
    --surface: #fafbf6;
    --tint: #edf4e3;
    --hairline: #cbd5c0;
    --ink: #1e2b1e;
    --muted: #4f5e4f;
    --leaf: #4e9a2a;
  }
  * { box-sizing: border-box; }
  html { background: var(--surface); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--surface);
    color: var(--ink);
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  header { display: flex; flex-direction: column; gap: 14px; }
  .rule { width: 80px; height: 8px; background: var(--leaf); border-radius: 4px; }
  h1 { margin: 0; font-size: 44px; line-height: 1.2; font-weight: 700; }
  .sub { margin: 0; font-size: 18px; color: var(--muted); }
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
    padding: 24px;
    background: var(--tint);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover, .card:focus-visible { border-color: var(--leaf); transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
  .name { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .desc { font-size: 17px; color: var(--muted); flex: 1; }
  .go { font-size: 17px; font-weight: 700; color: var(--leaf); }
  .empty { font-size: 18px; color: var(--muted); }
  @media (max-width: 520px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 34px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover, .card:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="rule"></div>
    <h1>Classroom tools</h1>
    <p class="sub">Pick a tool to open it.</p>
  </header>
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>No tools yet. Add one to the TOOLS list in this file.</p>
</main>

<script>
  // One line per tool. href is the tool's folder (or file) on this server.
  var TOOLS = [
    { name: "Picker wheel", desc: "Spin a wheel to pick a student or topic.", href: "picker/" },
    { name: "Timer", desc: "Countdown or repeating interval timer with a beep.", href: "timer/" },
    { name: "Group maker", desc: "Split the class into pairs or groups.", href: "groups/" },
    { name: "Sound articulator", desc: "Watch how each English consonant and vowel is made inside the mouth.", href: "articulator/" },
    { name: "Bingo", desc: "Spin to call items; every student gets their own random board on their phone.", href: "bingo/" }
  ];

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");

  if (!TOOLS.length) {
    empty.hidden = false;
  }

  TOOLS.forEach(function (tool) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "card";
    a.href = tool.href;

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = tool.name;

    var desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = tool.desc;

    var go = document.createElement("span");
    go.className = "go";
    go.textContent = "Open →";

    a.appendChild(name);
    a.appendChild(desc);
    a.appendChild(go);
    li.appendChild(a);
    grid.appendChild(li);
  });
</script>
</body>
</html>
